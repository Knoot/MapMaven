name: Publish Map Maven
run-name: Publish Map Maven ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build label (use a numeric version such as 1.6.6 when building an installer)'
        required: true
        type: string
      build_installer:
        description: 'Also create a Squirrel installer (requires a numeric version)'
        required: false
        default: false
        type: boolean

jobs:
  build:

    runs-on: windows-latest
    
    env:
      PUBLISH_PATH: "${{ github.workspace }}/artifacts/MapMaven-Windows"

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore workloads
      run: dotnet workload install maui-windows
    - name: Restore dependencies
      run: dotnet restore
    - name: Test
      run: dotnet test --logger "trx;LogFileName=test-results.trx"
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test results
        path: "**/test-results.trx"                            
        reporter: dotnet-trx
        fail-on-error: true
    - name: Publish
      run: >-
        dotnet publish -f net8.0-windows10.0.19041.0 -c Release -r win-x64
        -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
        -p:WindowsPackageType=None -p:PublishTrimmed=false
        -o "${{ env.PUBLISH_PATH }}"
      working-directory: "${{ github.workspace }}/MapMaven"
    - name: Zip build
      shell: pwsh
      run: |
        if (!(Test-Path -LiteralPath "$env:PUBLISH_PATH/MapMaven.exe")) {
          throw "Publish output is missing MapMaven.exe: $env:PUBLISH_PATH"
        }
        Copy-Item -LiteralPath scripts/Launch-MapMaven.cmd -Destination "$env:PUBLISH_PATH/"
        Copy-Item -LiteralPath docs/windows-v4-build.md -Destination "$env:PUBLISH_PATH/README.md"
        $packageDirectory = Join-Path $env:RUNNER_TEMP 'package'
        New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
        Compress-Archive -Path "$env:PUBLISH_PATH/*" -DestinationPath (Join-Path $packageDirectory 'MapMaven-win-x64.zip') -Force
    - name: Package build
      if: inputs.build_installer
      run: >
        & "$HOME/.nuget/packages/clowd.squirrel/2.11.1/tools/Squirrel.exe" pack
        --packId "MapMaven"
        --packVersion "${{ inputs.version }}"
        --packDirectory "${{ env.PUBLISH_PATH }}"
        --releaseDir "${{ runner.temp }}/package"
        --icon "${{ env.PUBLISH_PATH }}/Platforms/Windows/trayicon.ico"
        --appIcon "${{ env.PUBLISH_PATH }}/Platforms/Windows/trayicon.ico"
        --splashImage "${{ env.PUBLISH_PATH }}/Platforms/Windows/installation.gif"
        --packAuthors "DennisvHest"
        --packTitle "Map Maven" 
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: mapmaven-package
        path: "${{ runner.temp }}/package"
